<rect class="s" style="animation-delay:0.14s" x="0" y="19" width="1000" height="9" fill="#171614"/>
<rect class="s" style="animation-delay:0.21s" x="0" y="33" width="1000" height="5" fill="#2DB36A"/>
<rect class="s" style="animation-delay:0.28s" x="0" y="43" width="1000" height="3" fill="#171614"/>
</svg>
