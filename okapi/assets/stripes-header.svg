<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 46" preserveAspectRatio="none">
<style>
.s{transform-box:fill-box;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
