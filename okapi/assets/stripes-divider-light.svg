<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 43" preserveAspectRatio="none">
<style>
.s{transform-box:fill-box;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.s{animation:none}}
</style>
<rect class="s" style="animation-delay:0.00s" x="0" y="0" width="1000" height="8" fill="#F4F1EA"/>
<rect class="s" style="animation-delay:0.07s" x="0" y="14" width="1000" height="2" fill="#F4F1EA"/>
<rect class="s" style="animation-delay:0.14s" x="0" y="21" width="1000" height="5" fill="#2DB36A"/>
<rect class="s" style="animation-delay:0.21s" x="0" y="31" width="1000" height="12" fill="#F4F1EA"/>
</svg>
